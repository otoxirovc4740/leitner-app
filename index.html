<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitner Pro - Ultimate Flashcards</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --success-bg: #ecfdf5;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow-3d: 0 8px 0 #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.4s ease, box-shadow 0.4s ease;
        }

        body.glow-success { background-color: #e6f4ea; box-shadow: inset 0 0 80px rgba(16, 185, 129, 0.2); }
        body.glow-danger { background-color: #fce8e8; box-shadow: inset 0 0 80px rgba(239, 68, 68, 0.2); }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }

        .streak-badge {
            background: #fff;
            padding: 8px 16px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1.1rem;
            box-shadow: 0 4px 0 #cbd5e1;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Deck Selector */
        .top-controls {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 16px;
            border-radius: 20px;
            box-shadow: 0 8px 0 #cbd5e1;
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .deck-row { display: flex; gap: 10px; }
        select { flex: 1; padding: 10px; border-radius: 12px; border: 1px solid var(--border-color); background: #f8fafc; font-weight: 600; }
        
        .btn-deck-add, button.btn-add {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 0 #4338ca;
        }
        .btn-deck-add:active, button.btn-add:active { transform: translateY(2px); box-shadow: 0 2px 0 #4338ca; }

        /* Progress Bar */
        .progress-wrapper { width: 100%; max-width: 600px; margin-bottom: 20px; }
        .progress-info { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; }
        .progress-bar-bg { width: 100%; background: #e2e8f0; border-radius: 10px; height: 12px; overflow: hidden; }
        .progress-bar-fill { width: 0%; height: 100%; background: var(--success); transition: width 0.4s ease; }

        /* Input Section */
        .input-section {
            background: var(--card-bg); padding: 16px; border-radius: 20px;
            box-shadow: 0 8px 0 #cbd5e1; border: 1px solid var(--border-color);
            display: flex; gap: 10px; margin-bottom: 24px; width: 100%; max-width: 600px; flex-wrap: wrap;
        }
        input { flex: 1 1 180px; padding: 12px; border: 1px solid var(--border-color); border-radius: 12px; background: #f8fafc; }

        /* Review Notification Banner */
        .review-banner {
            width: 100%; max-width: 600px; background: #fffbeb; border: 1px solid #fcd34d; color: #b45309;
            padding: 12px; border-radius: 12px; font-weight: 600; text-align: center; margin-bottom: 20px; display: none;
        }

        /* 3D Flip Card */
        .card-container { width: 100%; max-width: 400px; height: 220px; perspective: 1000px; margin-bottom: 24px; }
        .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); cursor: pointer; border-radius: 24px; }
        .card.flipped { transform: rotateY(180deg); }
        .card-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 24px; border-radius: 24px; background: var(--card-bg); font-size: 1.35rem; font-weight: 700; text-align: center;
            box-shadow: 0 10px 0 #cbd5e1; border: 1px solid var(--border-color);
        }
        .audio-btn { position: absolute; top: 15px; right: 15px; background: #f1f5f9; border: none; border-radius: 50%; width: 38px; height: 38px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 #cbd5e1; }
        .audio-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #cbd5e1; }
        .card-back { transform: rotateY(180deg); color: var(--primary); }

        /* Controls */
        .controls { display: flex; gap: 16px; margin-bottom: 30px; width: 100%; max-width: 400px; }
        .btn-action { flex: 1; padding: 14px; border: none; border-radius: 16px; font-size: 1rem; font-weight: 800; cursor: pointer; }
        .btn-wrong { background: var(--danger-bg); color: var(--danger); box-shadow: 0 6px 0 #fca5a5; }
        .btn-correct { background: var(--success-bg); color: var(--success); box-shadow: 0 6px 0 #6ee7b7; }
        .btn-wrong:active { transform: translateY(3px); box-shadow: 0 2px 0 #fca5a5; }
        .btn-correct:active { transform: translateY(3px); box-shadow: 0 2px 0 #6ee7b7; }

        /* Gravitational Boxes Container */
        .boxes-container {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(95px, 1fr)); gap: 10px;
            width: 100%; max-width: 600px; margin-bottom: 30px; align-items: end;
        }
        .box {
            background: var(--card-bg); border-radius: 16px; padding: 12px 8px; text-align: center;
            border: 1px solid var(--border-color); border-top: 4px solid var(--primary);
            transition: all 0.3s ease; position: relative;
        }
        
        /* Gravity Effect on Boxes */
        .box-1 { box-shadow: 0 4px 0 #cbd5e1; transform: translateY(0); }
        .box-2 { box-shadow: 0 6px 0 #94a3b8; transform: translateY(-4px); }
        .box-3 { box-shadow: 0 8px 0 #64748b; transform: translateY(-8px); }
        .box-4 { box-shadow: 0 10px 0 #475569; transform: translateY(-12px); }
        .box-5 { box-shadow: 0 12px 0 #334155; transform: translateY(-16px); }

        .box h3 { font-size: 0.75rem; color: var(--text-muted); }
        .box .count { font-size: 1.3rem; font-weight: 800; }
        .box .due { font-size: 0.7rem; color: var(--danger); font-weight: 700; margin-top: 4px; }

        /* Card List */
        .list-section { width: 100%; max-width: 600px; background: var(--card-bg); border-radius: 20px; padding: 20px; box-shadow: 0 8px 0 #cbd5e1; border: 1px solid var(--border-color); margin-bottom: 30px; }
        .card-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid var(--border-color); }
        .card-item-actions { display: flex; gap: 10px; }
        .action-icon { background: none; border: none; cursor: pointer; font-size: 1.1rem; }

        .io-buttons { display: flex; gap: 10px; width: 100%; max-width: 600px; }
        .btn-io { flex: 1; background: #fff; border: 1px solid var(--border-color); padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 0 #cbd5e1; }
        .btn-io:active { transform: translateY(2px); box-shadow: 0 2px 0 #cbd5e1; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Leitner Pro</h1>
        <div class="streak-badge">🔥 <span id="streakDays">0</span> kun</div>
    </div>

    <div class="top-controls">
        <div class="deck-row">
            <select id="deckSelect" onchange="changeDeck()"></select>
            <button class="btn-deck-add" onclick="createDeck()">+ Yangi To'plam</button>
        </div>
        <button class="btn-deck-add" style="background:#475569" onclick="enableNotifications()">🔔 Bildirishnomalarni yoqish</button>
    </div>

    <div class="progress-wrapper">
        <div class="progress-info">
            <span>O'zlashtirish ko'rsatkichi</span>
            <span id="progressText">0%</span>
        </div>
        <div class="progress-bar-bg"><div id="progressBar" class="progress-bar-fill"></div></div>
    </div>

    <div class="input-section">
        <input type="text" id="frontInput" placeholder="Savol / So'z (Oldi)">
        <input type="text" id="backInput" placeholder="Javob / Tarjima (Orqasi)">
        <button class="btn-add" id="btnAdd" onclick="addOrUpdateCard()">Qo'shish</button>
    </div>

    <div id="reviewBanner" class="review-banner">
        Bugun takrorlashingiz kerak bo'lgan kartochkalar bor!
    </div>

    <div class="card-container">
        <div class="card" id="activeCard" onclick="flipCard()">
            <div class="card-face card-front">
                <div id="frontText">Bo'sh</div>
            </div>
            <div class="card-face card-back">
                <button class="audio-btn" id="audioBtn" onclick="speakCurrent(event)">🔊</button>
                <div id="cardBack">Javob</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-action btn-wrong" onclick="processCard(false)">✕ Xato (Qulash)</button>
        <button class="btn-action btn-correct" onclick="processCard(true)">✓ To'g'ri (Ko'tarilish)</button>
    </div>

    <div class="boxes-container">
        <div class="box box-1"><h3>1-Quti</h3><div class="count" id="count-1">0</div><div class="due" id="due-1"></div></div>
        <div class="box box-2"><h3>2-Quti</h3><div class="count" id="count-2">0</div><div class="due" id="due-2"></div></div>
        <div class="box box-3"><h3>3-Quti</h3><div class="count" id="count-3">0</div><div class="due" id="due-3"></div></div>
        <div class="box box-4"><h3>4-Quti</h3><div class="count" id="count-4">0</div><div class="due" id="due-4"></div></div>
        <div class="box box-5"><h3>5-Quti</h3><div class="count" id="count-5">0</div><div class="due" id="due-5"></div></div>
    </div>

    <div class="list-section">
        <h2 style="font-size: 1.1rem; margin-bottom: 10px;">To'plamdagi Kartochkalar</h2>
        <div id="cardList"></div>
    </div>

    <div class="io-buttons">
        <button class="btn-io" onclick="exportData()">📁 Faylni Saqlash (Export)</button>
        <button class="btn-io" onclick="document.getElementById('importFile').click()">📥 Yuklash (Import)</button>
        <input type="file" id="importFile" style="display:none;" onchange="importData(event)" accept=".json">
    </div>

    <script>
        let decks = JSON.parse(localStorage.getItem('leitner_decks')) || { "Asosiy": [] };
        let currentDeck = localStorage.getItem('leitner_current_deck') || "Asosiy";
        let currentCardIndex = -1;
        let editingCardId = null;

        // Interval kunlari (Spaced Repetition)
        const boxIntervals = {
            1: 0,   // Har kuni (yoki darhol)
            2: 3,   // 3 kundan keyin
            3: 5,   // 5 kundan keyin
            4: 7,   // 1 haftadan keyin
            5: 15   // 15 kundan keyin
        };

        // Migratsiya: Eski kartochkalarga nextReview qoshish
        Object.keys(decks).forEach(deckName => {
            decks[deckName].forEach(card => {
                if (!card.nextReview) card.nextReview = Date.now();
            });
        });

        function enableNotifications() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        alert("Bildirishnomalar yoqildi!");
                        checkAndNotify();
                    }
                });
            }
        }

        function checkAndNotify() {
            let totalDue = 0;
            Object.keys(decks).forEach(d => {
                totalDue += decks[d].filter(c => c.box < 5 && c.nextReview <= Date.now()).length;
            });
            
            if (totalDue > 0 && Notification.permission === "granted") {
                new Notification("Leitner Pro", {
                    body: `Bugun takrorlashingiz kerak bo'lgan ${totalDue} ta so'z bor!`,
                    icon: "🔥"
                });
            }
        }

        function updateStreak() {
            let lastVisit = localStorage.getItem('leitner_last_date');
            let streak = parseInt(localStorage.getItem('leitner_streak')) || 0;
            let today = new Date().toDateString();

            if (lastVisit !== today) {
                let yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
                if (lastVisit === yesterday.toDateString()) streak++;
                else if (!lastVisit) streak = 1;
                else streak = 1; 
                
                localStorage.setItem('leitner_last_date', today);
                localStorage.setItem('leitner_streak', streak);
                checkAndNotify(); // Kun o'zgarganda xabar berish
            }
            document.getElementById('streakDays').innerText = streak;
        }

        function saveAll() {
            localStorage.setItem('leitner_decks', JSON.stringify(decks));
            localStorage.setItem('leitner_current_deck', currentDeck);
            updateUI();
        }

        function createDeck() {
            let name = prompt("Yangi to'plam nomini kiriting:");
            if (name && !decks[name]) { decks[name] = []; currentDeck = name; saveAll(); }
        }

        function changeDeck() { currentDeck = document.getElementById('deckSelect').value; saveAll(); }

        function addOrUpdateCard() {
            const front = document.getElementById('frontInput').value.trim();
            const back = document.getElementById('backInput').value.trim();

            if (front && back) {
                if (editingCardId) {
                    let card = decks[currentDeck].find(c => c.id === editingCardId);
                    if (card) { card.front = front; card.back = back; }
                    editingCardId = null; document.getElementById('btnAdd').innerText = "Qo'shish";
                } else {
                    decks[currentDeck].push({ id: Date.now(), front, back, box: 1, nextReview: Date.now() });
                }
                document.getElementById('frontInput').value = '';
                document.getElementById('backInput').value = '';
                saveAll();
            }
        }

        function editCard(id) {
            let card = decks[currentDeck].find(c => c.id === id);
            if (card) {
                document.getElementById('frontInput').value = card.front;
                document.getElementById('backInput').value = card.back;
                editingCardId = id; document.getElementById('btnAdd').innerText = "Saqlash";
                document.getElementById('frontInput').focus();
            }
        }

        function deleteCard(id) {
            if(confirm("O'chirmoqchimisiz?")) {
                decks[currentDeck] = decks[currentDeck].filter(c => c.id !== id); saveAll();
            }
        }

        function flipCard() {
            if (currentCardIndex !== -1) document.getElementById('activeCard').classList.toggle('flipped');
        }

        function speakCurrent(event) {
            event.stopPropagation();
            if (currentCardIndex === -1) return;
            let utterance = new SpeechSynthesisUtterance(decks[currentDeck][currentCardIndex].back);
            utterance.lang = 'en-US'; window.speechSynthesis.speak(utterance);
        }

        function processCard(isCorrect) {
            if (currentCardIndex === -1) return;
            let card = decks[currentDeck][currentCardIndex];
            
            document.body.classList.add(isCorrect ? 'glow-success' : 'glow-danger');
            setTimeout(() => document.body.classList.remove(isCorrect ? 'glow-success' : 'glow-danger'), 400);

            if (isCorrect) { 
                if (card.box < 5) {
                    card.box++; 
                    // Keyingi safar chiqish vaqtini hisoblash (kunlarni millisekundga aylantirish)
                    card.nextReview = Date.now() + (boxIntervals[card.box] * 24 * 60 * 60 * 1000);
                } 
            } else { 
                card.box = 1; // Xato qilsa "qulaydi"
                card.nextReview = Date.now(); // Darhol qayta so'raydi
            }

            let cardEl = document.getElementById('activeCard');
            if (cardEl.classList.contains('flipped')) {
                cardEl.classList.remove('flipped');
                setTimeout(saveAll, 300);
            } else { saveAll(); }
        }

        function updateUI() {
            let select = document.getElementById('deckSelect'); select.innerHTML = '';
            Object.keys(decks).forEach(d => {
                let opt = document.createElement('option'); opt.value = d; opt.innerText = d;
                if (d === currentDeck) opt.selected = true; select.appendChild(opt);
            });

            let cards = decks[currentDeck] || [];
            let now = Date.now();

            // Qutilar statistikasi va "Vaqti kelganlar"ni hisoblash
            for (let i = 1; i <= 5; i++) {
                let boxCards = cards.filter(c => c.box === i);
                let dueCards = boxCards.filter(c => c.nextReview <= now && i < 5).length;
                
                document.getElementById(`count-${i}`).innerText = boxCards.length;
                let dueText = document.getElementById(`due-${i}`);
                if (dueCards > 0) dueText.innerText = `+${dueCards} tayyor`;
                else dueText.innerText = '';
            }

            if (cards.length > 0) {
                let percent = Math.round((cards.filter(c => c.box === 5).length / cards.length) * 100);
                document.getElementById('progressBar').style.width = percent + '%';
                document.getElementById('progressText').innerText = percent + '%';
            } else {
                document.getElementById('progressBar').style.width = '0%'; document.getElementById('progressText').innerText = '0%';
            }

            // Faqat vaqti kelgan (nextReview <= Hozir) kartochkalarni ko'rsatish
            let available = cards.filter(c => c.box < 5 && c.nextReview <= now);
            
            if (available.length > 0) {
                document.getElementById('reviewBanner').style.display = 'block';
                let randomCard = available[Math.floor(Math.random() * available.length)];
                currentCardIndex = cards.findIndex(c => c.id === randomCard.id);
                document.getElementById('frontText').innerText = randomCard.front;
                document.getElementById('cardBack').innerText = randomCard.back;
                document.getElementById('audioBtn').style.display = 'flex';
            } else {
                document.getElementById('reviewBanner').style.display = 'none';
                currentCardIndex = -1;
                document.getElementById('frontText').innerText = "Hozircha hamma darslar tugadi! 🏖️";
                document.getElementById('cardBack').innerText = "";
                document.getElementById('audioBtn').style.display = 'none';
            }

            let list = document.getElementById('cardList'); list.innerHTML = '';
            cards.forEach(c => {
                let dateStr = new Date(c.nextReview).toLocaleDateString();
                let div = document.createElement('div'); div.className = 'card-item';
                div.innerHTML = `
                    <div><strong>${c.front}</strong> - ${c.back} <br>
                    <span style="font-size:0.75rem; color:var(--primary);">(${c.box}-quti | Keyingi: ${dateStr})</span></div>
                    <div class="card-item-actions">
                        <button class="action-icon" onclick="editCard(${c.id})">✏️</button>
                        <button class="action-icon" onclick="deleteCard(${c.id})">🗑️</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        // Export/Import
        function exportData() {
            let a = document.createElement('a');
            a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(decks));
            a.download = "leitner_backup.json"; a.click();
        }
        function importData(event) {
            let reader = new FileReader();
            reader.onload = function(e) {
                try { decks = JSON.parse(e.target.result); currentDeck = Object.keys(decks)[0] || "Asosiy"; saveAll(); alert("Yuklandi!"); } 
                catch (err) { alert("Xatolik!"); }
            }; reader.readAsText(event.target.files[0]);
        }

        updateStreak();
        updateUI();
    </script>
</body>
</html>
